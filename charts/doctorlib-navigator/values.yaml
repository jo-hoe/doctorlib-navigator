image:
  # -- Image repository for the doctorlib-navigator container
  repository: ghcr.io/jo-hoe/doctorlib-navigator
  # -- Image pull policy
  pullPolicy: IfNotPresent
  # -- Overrides the image tag (defaults to chart appVersion)
  tag: ""

# -- SMTP credentials rendered into a Kubernetes Secret
notification:
  email:
    # -- SMTP username injected as SMTP_USERNAME env var; overrides the config file value
    username: ""
    # -- SMTP password injected as SMTP_PASSWORD env var; overrides the config file value
    password: ""

# -- Application configuration mounted as config.yaml; see dev/config.yaml for a full example
config:
  # -- List of Doctolib doctor profiles to monitor.
  # -- To find the correct values for a doctor, run discovery locally (requires Python + dependencies):
  # --   python discover.py <profile_slug>
  # -- The profile_slug is the last path segment of the doctor's Doctolib URL, e.g.:
  # --   https://www.doctolib.de/allgemeinmedizin/berlin/max-mustermann -> "max-mustermann"
  # -- Discovery prints all bookable appointment types with their insurance options and
  # -- a ready-to-paste values.yaml snippet.
  # --
  # -- Each entry:
  # --   name:          Human-readable label used in notification subjects.
  # --   profile_slug:  Last path segment of the doctor's Doctolib URL (see above).
  # --   insurance:     "public" or "private". Omit if the doctor only has one option
  # --                  (discovery will tell you which apply).
  # --   booking_steps: List of {label, value} pairs. Always include one entry with
  # --                  label "visit_motive" and the appointment type name as value
  # --                  (exactly as shown by discovery mode).
  # --   windows:       Optional list of {start_date, end_date} ISO date ranges.
  # --                  A slot triggers a notification if it falls in ANY window.
  # --                  Omit entirely for no date restriction.
  # --
  # -- Example (values discovered via RUN_MODE=discover):
  # --   doctors:
  # --     - name: "Dr. Example"
  # --       profile_slug: "dr-example-berlin"
  # --       insurance: "public"
  # --       booking_steps:
  # --         - label: "visit_motive"
  # --           value: "Erstuntersuchung / Folgeuntersuchung"
  # --       windows:
  # --         - end_date: "2026-12-31"
  doctors: []
  # -- Notification channel config (non-sensitive fields only; credentials go in notification.email above)
  notification: {}
  # -- Seconds between availability checks when runMode is daemon
  check_interval_seconds: 300
  # -- Maximum number of available slots to include in the notification
  availability_limit: 5

job:
  # -- Cron schedule for the CronJob (only used when runMode is job)
  schedule: "*/5 * * * *"
  # -- Timezone for the cron schedule
  timeZone: "Europe/Berlin"
  # -- Seconds to keep finished Job pods before deletion
  ttlSecondsAfterFinished: 86400
  # -- Create an initial Job immediately on Helm install
  executeOnStartUp: true

# -- Run mode: "job" runs once per cron trigger; "daemon" loops using check_interval_seconds
runMode: "job"

# -- Log level for the application: DEBUG, INFO, WARNING, ERROR
logLevel: "INFO"

# -- Persistent storage for deduplication state (prevents re-sending notifications across runs)
state:
  # -- Storage size for the state PVC
  storageSize: "10Mi"
  # -- StorageClassName for the state PVC; leave empty to use the cluster default
  storageClassName: ""

serviceAccount:
  # -- Create a dedicated ServiceAccount for the workload
  create: true
  # -- Override the ServiceAccount name (defaults to the release fullname)
  name: ""

# -- Pod-level security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001

# -- Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- CPU and memory resource requests and limits
resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# -- Node selector for pod scheduling
nodeSelector: {}
# -- Tolerations for pod scheduling
tolerations: []
# -- Affinity rules for pod scheduling
affinity: {}
