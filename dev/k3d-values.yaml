# Override values for local k3d development
logLevel: "DEBUG"

config:
  doctors:
    - name: "Dr. Example"
      profile_slug: "dr-example-berlin"
      insurance: "public"
      booking_steps:
        - label: "visit_motive"
          value: "Erstuntersuchung / Folgeuntersuchung"
      windows:
        - end_date: "2026-12-31"
  notification:
    email:
      smtp_host: "smtp.example.com"
      smtp_port: 587
      from_address: "noreply@example.com"
      to_addresses:
        - "you@example.com"
      use_tls: true
  check_interval_seconds: 300
  availability_limit: 5

notification:
  email:
    username: "your-smtp-username"
    password: "your-smtp-password"

job:
  schedule: "*/5 * * * *"
  timeZone: "Europe/Berlin"
