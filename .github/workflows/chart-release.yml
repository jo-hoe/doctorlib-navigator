name: Release Chart

on:
  push:
    branches:
      - master
    paths:
      - "charts/doctorlib-navigator/Chart.yaml"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Generate Helm docs
        run: |
          docker run --rm -v "${{ github.workspace }}:/helm-docs" jnorwood/helm-docs:latest

      - name: Commit updated Helm docs
        run: |
          git add charts/doctorlib-navigator/README.md
          git diff --staged --quiet || git commit -m "docs: regenerate helm chart README [skip ci]"
          git push

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
